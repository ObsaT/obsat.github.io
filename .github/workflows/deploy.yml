name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href=/soor_web/

      - name: Prepare deploy folder
        run: |
          # Move browser build to a clean deploy directory
          mkdir -p deploy_output
          cp -r dist/soor_tech/browser/. deploy_output/
          # Copy 404.html for SPA routing fallback
          cp deploy_output/index.html deploy_output/404.html
          # Confirm files
          ls -la deploy_output/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_output
          branch: gh-pages
          clean: true
